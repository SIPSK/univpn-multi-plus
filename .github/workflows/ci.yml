name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python fixtures and manager-only build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests with fake native bridges
        run: python -m unittest discover -s tests -v
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build manager without vendor installers
        run: python tools/build_package.py --distribution manager-only

  frontend:
    name: Local mock browser
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run frontend against its local mock server
        run: npm test
      - name: Keep synthetic screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-fixtures
          path: web/tests/artifacts/
          if-no-files-found: ignore
